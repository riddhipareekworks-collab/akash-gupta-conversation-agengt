services:
  - type: web
    name: akash-gupta-conversation-agengt
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ASSET_STORAGE
        value: postgres
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_OWNER_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
